name: qros

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: qros
      POSTGRES_USER: qros
      POSTGRES_PASSWORD: ${QROS_POSTGRES_PASSWORD:-qros_dev}
    ports:
      - "127.0.0.1:${QROS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7
    environment:
      QROS_REDIS_PASSWORD: ${QROS_REDIS_PASSWORD:-qros_dev}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$QROS_REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${QROS_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$QROS_REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
