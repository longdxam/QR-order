name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Clean, test, and package backend
        run: ./gradlew clean test bootJar --no-daemon

  guest-web:
    name: Guest web build and bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-guest/package-lock.json

      - name: Install guest web dependencies
        run: npm ci
        working-directory: web-guest

      - name: Test, typecheck, lint, and build guest web
        run: |
          npm run test:unit
          npm run typecheck
          npm run lint
          npm run build
        working-directory: web-guest

      - name: Enforce NFR-PERF-07 initial JavaScript budget
        run: npm run bundle:check
        working-directory: web-guest
