spring:
  datasource:
    url: jdbc:postgresql://localhost:${QROS_POSTGRES_PORT:5433}/qros
    username: ${QROS_DB_USERNAME:qros}
    password: ${QROS_POSTGRES_PASSWORD:qros_dev}
  data:
    redis:
      host: localhost
      port: ${QROS_REDIS_PORT:6379}
      password: ${QROS_REDIS_PASSWORD:qros_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  server:
    address: 127.0.0.1

